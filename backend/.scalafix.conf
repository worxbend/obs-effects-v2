# Linting and automated refactoring rules (https://scalacenter.github.io/scalafix).
#
# Run them with `./mill fixAll` (rewrites files) or `./mill lint` (reports and fails, writes
# nothing). Both are wired up in build.mill; see the "Formatting and linting" section there.
#
# Only rules that ship inside scalafix itself are enabled, so there is no extra artifact to pin and
# keep in step with the scalafix version.
#
# A warning about this file, learned the hard way: scalafix **silently ignores** a setting whose
# name it does not recognise. A misspelled key looks like it is switched on and does nothing. If
# you add a setting here, change it to the value you do *not* want and confirm the run fails.
rules = [
  DisableSyntax,      # bans a handful of constructs that hide bugs (see the options below)
  OrganizeImports,    # one consistent order and grouping for import statements
  RemoveUnused        # deletes unused imports and unused private/local definitions
]

# --- DisableSyntax -----------------------------------------------------------------------------
# Purely syntactic: it reads the source text and never needs the compiler. Everything here defaults
# to `false` (allowed), so the `= false` lines below are documentation of a deliberate decision
# rather than a switch that does something.
DisableSyntax.noVars = false     # `var` is allowed inside methods; see the retry loop in MongoConnection
DisableSyntax.noThrows = false   # throwing is reserved for corrupt stored data, which is unrecoverable
DisableSyntax.noNulls = false    # the MongoDB and BSON APIs are Java APIs and return null
DisableSyntax.noIsInstanceOf = false
DisableSyntax.noReturns = true   # an early `return` inside a lambda unwinds the enclosing method, which
                                 # almost nobody expects; use if/else instead
DisableSyntax.noFinalize = true  # `finalize` has been deprecated since Java 9 and its timing is undefined
DisableSyntax.noTabs = true      # .scalafmt.conf indents with spaces; a stray tab would fight it

# --- OrganizeImports ---------------------------------------------------------------------------
# Enforces the grouping this codebase already uses by hand: everything else first, then a blank
# line, then `java.`/`javax.`, then `scala.`. That order is scalafix's own default, spelled out
# here so it is visible rather than implied.
#
# Note the division of labour with the rule below. OrganizeImports *can* delete unused imports too,
# but then two rules would be editing the same lines and the result depends on which runs first.
# `removeUnused = false` hands that job to `RemoveUnused` alone; this rule only ever reorders,
# regroups and merges.
OrganizeImports.removeUnused = false
OrganizeImports.groups = ["*", "re:javax?\\.", "scala."]
OrganizeImports.groupedImports = Merge   # two imports from one package become `import a.{b, c}`
OrganizeImports.targetDialect = Scala3   # emit `import a.*`, never the Scala 2 `import a._`

# --- RemoveUnused ------------------------------------------------------------------------------
# Semantic: it reads the warnings the compiler emitted, so it works only because `-Wunused:all` is
# set in build.mill and because Mill recompiles with SemanticDB before running scalafix. Turn that
# compiler flag off and this rule quietly stops finding anything.
