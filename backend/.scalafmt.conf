# Formatting rules for this module, applied by scalafmt (https://scalameta.org/scalafmt).
#
# Run `./mill reformatAll` to rewrite every Scala file, or `./mill checkFormatAll` to fail without
# touching anything (that second one is what CI runs). Both are defined in build.mill.
#
# scalafmt only ever changes *layout* — where the line breaks go. It never changes what the code
# means. The rules that can change meaning live in `.scalafix.conf` next to this file.

# Pinned deliberately: scalafmt's output changes between versions, so an unpinned version would
# make CI disagree with whatever the last person had installed. Mill reads this number and
# downloads that exact scalafmt.
version = 3.11.5

# Scala 3 syntax, but this codebase deliberately uses the classic curly-brace style (the compiler
# enforces it via the `-no-indent` flag in build.mill). scalafmt keeps braces as written; none of
# the "remove optional braces" rewrites are enabled below, so formatting never changes the style.
#
# This line is load-bearing beyond style: the Scala 2 dialect cannot parse `import a.*` or a
# `given` import selector, both of which this codebase uses.
runner.dialect = scala3

# 120 characters. Chosen to match the code that was already written — the longest line in the
# codebase is exactly 120 — so turning the formatter on reflowed nothing.
maxColumn = 120

# Scaladoc comments are laid out with a leading space and an asterisk on each continuation line
# (`  * like this`), and long paragraphs are re-wrapped to maxColumn.
docstrings.style = SpaceAsterisk
docstrings.wrap = yes

# SortImports orders the selectors *inside* one import — `import a.{b, A}` becomes
# `import a.{A, b}`. It does not reorder the import statements themselves; that is scalafix's
# `OrganizeImports` rule, and the two produce the same ordering, so running one after the other
# is stable.
#
# RedundantParens drops parentheses that carry no meaning, for example `if ((a))`.
rewrite.rules = [SortImports, RedundantParens]

# No dangling comma before a closing bracket. Trailing commas make one-line diffs when adding an
# argument, but they also read as a typo to anyone who has not met them, and this codebase does
# not use them anywhere today.
trailingCommas = never
